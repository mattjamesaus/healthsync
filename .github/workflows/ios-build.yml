name: iOS build

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Health Sync
        run: >
          xcodebuild
          -project HealthSync.xcodeproj
          -target HealthSync
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

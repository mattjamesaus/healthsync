name: HealthSync
options:
  bundleIdPrefix: com.mattjamesaus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  # Pinned to the 9.30.1 commit. A version range fails on Xcode 16.4 because
  # Package@swift-6.1.swift depends on KSCrash by revision.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    revision: 4f135c52afeeb1d6937eb93824c7ec1cddcaa372
  # Stay on 9.x. 10.0.0 needs Xcode 27 / AppAuth 3.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.2.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
targets:
  HealthSync:
    type: application
    platform: iOS
    sources:
      - path: HealthSync
    dependencies:
      - package: Sentry
        product: Sentry
      - package: GoogleSignIn
        product: GoogleSignIn
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattjamesaus.HealthSyncApp
        INFOPLIST_FILE: HealthSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: HealthSync/HealthSync.entitlements
        GENERATE_INFOPLIST_FILE: false
        DEVELOPMENT_TEAM: QRJV5T3359
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    postBuildScripts:
      - name: Upload Debug Symbols
        path: scripts/upload-dsyms.sh
        basedOnDependencyAnalysis: false
        inputFiles:
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${EXECUTABLE_NAME}"
    entitlements:
      path: HealthSync/HealthSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: HealthSync/Info.plist
      properties:
        CFBundleDisplayName: HealthSync
        CFBundleName: HealthSync
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SentryDSN: "$(SENTRY_DSN)"
        GIDClientID: "$(GID_CLIENT_ID)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "$(GID_REVERSED_CLIENT_ID)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        NSHealthShareUsageDescription: Health Sync reads your Health data to export CSV into your own Google Drive.
        NSHealthUpdateUsageDescription: Health Sync does not write health data; this permission is unused.

schemes:
  HealthSync:
    build:
      targets:
        HealthSync: all
    run:
      config: Debug
    archive:
      config: Release
